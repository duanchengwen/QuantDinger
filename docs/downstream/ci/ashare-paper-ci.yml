name: A-share paper acceptance

on:
  push:
    branches: [ashare-paper]
  pull_request:
    branches: [ashare-paper]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python: ['3.11', '3.12']
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ashare_test
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: ashare_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ashare_test -d ashare_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend_api_python
    env:
      TEST_ASHARE_DATABASE_URL: postgresql://ashare_test:disposable-ci-only@127.0.0.1:5432/ashare_test
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-ashare-test.txt
      - run: ruff check app/ashare tests/ashare
      - name: Paper, safety and relevant upstream contracts
        run: >-
          python -m pytest -p pytest_timeout tests/ashare tests/test_execution_contract.py
          tests/test_ai_agent_contract_alignment.py tests/test_auth_security.py tests/test_auth_time_windows.py
          -k 'not retired_parameter_tuning_is_not_exposed_or_billable' -q
      - run: python -m app.ashare --help
      - run: python -m app.ashare.healthcheck --help
      - name: Isolated multi-trading-day replay
        run: python -m app.ashare.multiday_validation --output reports/acceptance/multiday.json
      - name: Deployment tooling safety
        run: python -m pytest ../scripts/ops/tests -q
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: multiday-python-${{ matrix.python }}
          path: backend_api_python/reports/acceptance/

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - run: npm install --global pnpm@10.33.4
      - run: node --test frontend_extensions/ashare-paper/tests/*.test.mjs
      - run: python scripts/frontend/prepare_ashare_frontend.py ../official-frontend --build
      - run: python scripts/check_docs.py

  windows-boundaries:
    # Database-backed acceptance runs on Ubuntu above; this job validates
    # Windows import/CLI, quote parsing, configuration and safety boundaries.
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend_api_python
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-ashare-test.txt
      - run: >-
          python -m pytest -p pytest_timeout tests/ashare/test_market.py
          tests/ashare/test_runtime.py tests/ashare/test_safety.py
          tests/ashare/test_notifications.py tests/ashare/test_calendar_rules.py
          tests/ashare/test_auth_outage.py -q
      - run: python -m app.ashare --help
